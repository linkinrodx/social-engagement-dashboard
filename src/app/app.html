<mat-toolbar color="primary">
  <button
    mat-icon-button
    class="menu-button"
    (click)="toggleSidenav()"
    aria-label="Toggle navigation"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span>Social Engagement Dashboard</span>
</mat-toolbar>

@if (showInstallBanner()) {
  <div class="install-banner">
    <span>Instala nuestra app para una experiencia más rápida</span>
    <button mat-stroked-button color="primary" (click)="installApp()">Instalar</button>
    <button mat-icon-button class="close-banner" (click)="dismissInstallBanner()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>
}

<mat-drawer-container [class.with-banner]="showInstallBanner()">
  <mat-drawer
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (closed)="sidenavOpened.set(false)"
  >
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" (click)="closeSidenavOnMobile()">
        <mat-icon>dashboard</mat-icon>
        Dashboard
      </a>
      <a mat-list-item routerLink="/executions" routerLinkActive="active-link" (click)="closeSidenavOnMobile()">
        <mat-icon>history</mat-icon>
        Ejecuciones
      </a>
      <a mat-list-item routerLink="/comments" routerLinkActive="active-link" (click)="closeSidenavOnMobile()">
        <mat-icon>comment</mat-icon>
        Comentarios
      </a>
      <a mat-list-item routerLink="/settings" routerLinkActive="active-link" (click)="closeSidenavOnMobile()">
        <mat-icon>settings</mat-icon>
        Configuración
      </a>
    </mat-nav-list>
  </mat-drawer>
  <mat-drawer-content>
    <div class="content">
      <router-outlet />
    </div>
  </mat-drawer-content>
</mat-drawer-container>
